<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="dteNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#060d1a"/>
    </linearGradient>
    <linearGradient id="dteGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="dteAzure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Outer Double Ring -->
  <circle cx="100" cy="100" r="94" fill="url(#dteNavy)" stroke="url(#dteGold)" stroke-width="3"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Technical Cog / Gear (12 teeth) -->
  <g transform="translate(100, 78)" fill="none" stroke="url(#dteAzure)" stroke-width="2.5">
    <circle cx="0" cy="0" r="28" fill="#0f2444" stroke="url(#dteGold)" stroke-width="2"/>
    <!-- Gear teeth -->
    <path d="M-4,-34 L4,-34 L3,-28 L-3,-28 Z" fill="url(#dteGold)"/>
    <path d="M-4,34 L4,34 L3,28 L-3,28 Z" fill="url(#dteGold)"/>
    <path d="M-34,-4 L-34,4 L-28,3 L-28,-3 Z" fill="url(#dteGold)"/>
    <path d="M34,-4 L34,4 L28,3 L28,-3 Z" fill="url(#dteGold)"/>
    <path d="M-24,-24 L-18,-28 L-15,-23 L-20,-19 Z" fill="url(#dteGold)"/>
    <path d="M24,24 L18,28 L15,23 L20,19 Z" fill="url(#dteGold)"/>
    <path d="M24,-24 L28,-18 L23,-15 L19,-20 Z" fill="url(#dteGold)"/>
    <path d="M-24,24 L-28,18 L-23,15 L-19,20 Z" fill="url(#dteGold)"/>
  </g>

  <!-- Torch of Knowledge / Flame -->
  <path d="M 100 56 Q 106 66 100 74 Q 94 66 100 56 Z" fill="url(#dteGold)"/>
  <circle cx="100" cy="67" r="2.5" fill="#ffffff"/>

  <!-- Open Book of Learning -->
  <path d="M 82 85 C 90 82 98 83 100 86 C 102 83 110 82 118 85 L 118 97 C 110 94 102 95 100 98 C 98 95 90 94 82 97 Z" fill="#ffffff" stroke="url(#dteGold)" stroke-width="1.2"/>
  <line x1="100" y1="86" x2="100" y2="98" stroke="#0a192f" stroke-width="1.2"/>

  <!-- Central DTE Monogram Banner -->
  <rect x="52" y="108" width="96" height="20" rx="4" fill="#0f2444" stroke="url(#dteGold)" stroke-width="1.5"/>
  <text x="100" y="122.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="2">D T E</text>

  <!-- State & Department Labels -->
  <text x="100" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="6.5" font-weight="800" fill="#fbbf24" letter-spacing="1">DIRECTORATE OF</text>
  <text x="100" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="900" fill="#ffffff" letter-spacing="0.8">TECHNICAL EDUCATION</text>
  <text x="100" y="164" text-anchor="middle" font-family="system-ui, sans-serif" font-size="6" font-weight="700" fill="#38bdf8" letter-spacing="1">MAHARASHTRA STATE</text>
</svg>
