<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="goldPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="12" y="12" width="176" height="176" rx="36" fill="#060d1a" stroke="url(#goldPulse)" stroke-width="2.5"/>
  <rect x="20" y="20" width="160" height="160" rx="30" fill="#0a192f"/>

  <!-- Cloud Graphic with Messaging Waves -->
  <path d="M 60 105 A 22 22 0 0 1 96 82 A 28 28 0 0 1 140 92 A 20 20 0 0 1 144 126 L 64 126 A 18 18 0 0 1 60 105 Z" fill="url(#cloudNavy)" stroke="#38bdf8" stroke-width="2"/>

  <!-- Transmission Waves (SMS, Email, WhatsApp) -->
  <path d="M 120 62 A 50 50 0 0 1 162 104" fill="none" stroke="url(#goldPulse)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 112 70 A 38 38 0 0 1 148 106" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 104 78 A 26 26 0 0 1 134 108" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Omnichannel Channel Icons (Small dots) -->
  <circle cx="70" cy="112" r="5" fill="#22c55e"/> <!-- WhatsApp -->
  <circle cx="100" cy="112" r="5" fill="#f59e0b"/> <!-- SMS / DLT -->
  <circle cx="130" cy="112" r="5" fill="#38bdf8"/> <!-- Email -->

  <!-- Brand Typography -->
  <text x="100" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" letter-spacing="1.5">MEGHDOOT</text>
  <text x="100" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="6" font-weight="700" fill="#fbbf24" letter-spacing="0.8">OMNICHANNEL GATEWAY</text>
</svg>
