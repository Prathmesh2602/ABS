<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="prisonNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="prisonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Heavy Shield Base -->
  <path d="M 100 12 L 175 40 C 175 118 100 182 100 182 C 100 182 25 118 25 40 Z" fill="url(#prisonNavy)" stroke="url(#prisonGold)" stroke-width="3.5"/>
  <path d="M 100 24 L 164 48 C 164 112 100 168 100 168 C 100 168 36 112 36 48 Z" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Star of Protection -->
  <polygon points="100,52 110,72 132,74 116,88 121,110 100,98 79,110 84,88 68,74 90,72" fill="url(#prisonGold)"/>
  
  <!-- Scales of Justice at Center -->
  <circle cx="100" cy="85" r="4" fill="#0f172a"/>
  <line x1="86" y1="88" x2="114" y2="88" stroke="#0f172a" stroke-width="2"/>
  <polygon points="86,88 80,98 92,98" fill="#0f172a"/>
  <polygon points="114,88 108,98 120,98" fill="#0f172a"/>

  <!-- Text -->
  <text x="100" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7.5" font-weight="900" fill="#ffffff" letter-spacing="1.2">MAHARASHTRA</text>
  <text x="100" y="154" text-anchor="middle" font-family="system-ui, sans-serif" font-size="6.5" font-weight="800" fill="#fbbf24" letter-spacing="0.8">PRISONS &amp; CORRECTIONAL</text>
  <text x="100" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="5.5" font-weight="700" fill="#cbd5e1" letter-spacing="0.5">DYNAMIC CMS PORTAL</text>
</svg>
