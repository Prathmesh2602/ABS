<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="llmNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#060d1a"/>
    </linearGradient>
    <linearGradient id="llmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="llmAzure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Hexagonal / Shield Base -->
  <polygon points="100,10 185,50 185,145 100,190 15,145 15,50" fill="url(#llmNavy)" stroke="url(#llmGold)" stroke-width="3"/>
  <polygon points="100,20 173,56 173,138 100,178 27,138 27,56" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Scanning Laser Ray -->
  <line x1="35" y1="95" x2="165" y2="95" stroke="url(#llmGold)" stroke-width="2.5" filter="url(#goldGlow)"/>
  <polygon points="32,95 24,91 24,99" fill="#f59e0b"/>
  <polygon points="168,95 176,91 176,99" fill="#f59e0b"/>

  <!-- Document Sheet Graphic -->
  <rect x="68" y="48" width="64" height="84" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Folded corner -->
  <polygon points="116,48 132,64 116,64" fill="#94a3b8"/>
  <polygon points="116,48 132,64 132,48" fill="#f1f5f9"/>

  <!-- Text lines inside doc -->
  <line x1="78" y1="62" x2="106" y2="62" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
  <line x1="78" y1="74" x2="122" y2="74" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <line x1="78" y1="84" x2="118" y2="84" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <line x1="78" y1="104" x2="122" y2="104" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="78" y1="114" x2="110" y2="114" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

  <!-- Neural Sparks / AI Star -->
  <g fill="url(#llmGold)">
    <path d="M 148 40 Q 155 40 155 33 Q 155 40 162 40 Q 155 40 155 47 Q 155 40 148 40 Z"/>
    <path d="M 42 125 Q 48 125 48 119 Q 48 125 54 125 Q 48 125 48 131 Q 48 125 42 125 Z"/>
    <circle cx="100" cy="155" r="4"/>
    <circle cx="75" cy="162" r="2.5"/>
    <circle cx="125" cy="162" r="2.5"/>
    <line x1="75" y1="162" x2="100" y2="155" stroke="url(#llmAzure)" stroke-width="1.5"/>
    <line x1="125" y1="162" x2="100" y2="155" stroke="url(#llmAzure)" stroke-width="1.5"/>
  </g>

  <!-- Emblem Text -->
  <text x="100" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="800" fill="#f8fafc" letter-spacing="1">GOVT LLM OCR</text>
</svg>
