<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="ayushNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="ayushGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Circular Outer Shield -->
  <circle cx="100" cy="100" r="92" fill="url(#ayushNavy)" stroke="url(#ayushGold)" stroke-width="3"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Kalasha / Ayurvedic Pot Base -->
  <path d="M 80 125 Q 100 135 120 125 L 118 105 Q 100 112 82 105 Z" fill="url(#ayushGold)"/>
  <ellipse cx="100" cy="105" rx="18" ry="4" fill="#ca8a04"/>

  <!-- Medicinal Leaf Motif (Sprouting from Kalasha) -->
  <!-- Center Leaf -->
  <path d="M 100 102 C 90 75 92 48 100 38 C 108 48 110 75 100 102 Z" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
  <line x1="100" y1="45" x2="100" y2="98" stroke="#166534" stroke-width="1.5"/>
  <!-- Left Leaf -->
  <path d="M 94 92 C 70 82 62 62 68 50 C 80 56 90 76 94 92 Z" fill="#4ade80" stroke="#15803d" stroke-width="1.5"/>
  <!-- Right Leaf -->
  <path d="M 106 92 C 130 82 138 62 132 50 C 120 56 110 76 106 92 Z" fill="#4ade80" stroke="#15803d" stroke-width="1.5"/>

  <!-- Medical Cross / Staff Accent -->
  <circle cx="100" cy="34" r="5" fill="url(#ayushGold)"/>

  <!-- Brand Typography -->
  <text x="100" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" letter-spacing="1.2">PRADNYA AYUSH</text>
  <text x="100" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="6" font-weight="700" fill="#fde047" letter-spacing="0.8">BAMS MEDICAL ERP</text>
  <text x="100" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="5" font-weight="600" fill="#86efac" letter-spacing="0.5">NCISM • MUHS COMPLIANT</text>
</svg>
