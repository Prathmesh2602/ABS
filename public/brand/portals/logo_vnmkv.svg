<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="vnmkvGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="vnmkvGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Circular Outer Shield -->
  <circle cx="100" cy="100" r="94" fill="#ffffff" stroke="#1e3a8a" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="url(#vnmkvGreen)"/>
  <circle cx="100" cy="100" r="64" fill="#ffffff" stroke="url(#vnmkvGold)" stroke-width="2"/>

  <!-- Gear Cog Wheel (Technology in Agriculture) -->
  <circle cx="100" cy="95" r="32" fill="none" stroke="#15803d" stroke-width="5" stroke-dasharray="10,6"/>
  
  <!-- Central Crop Ear & Flame -->
  <path d="M 100 68 C 94 78 94 92 100 114 C 106 92 106 78 100 68 Z" fill="url(#vnmkvGold)"/>
  <circle cx="100" cy="62" r="4" fill="#f59e0b"/>

  <!-- University Name & Location -->
  <text x="100" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" font-weight="900" fill="#ffffff" letter-spacing="1.5">VNMKV PARBHANI</text>
  <text x="100" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#1e3a8a" letter-spacing="0.8">AUMS PORTAL</text>
  <text x="100" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="6" font-weight="700" fill="#ffffff" letter-spacing="0.5">AGRICULTURE UNIVERSITY</text>
</svg>
