<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="imNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2444"/>
      <stop offset="100%" stop-color="#061224"/>
    </linearGradient>
    <linearGradient id="imAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Circular Outer Container -->
  <circle cx="100" cy="100" r="92" fill="url(#imNavy)" stroke="url(#imAmber)" stroke-width="3"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- 3D Isometric Room / Spatial Cube -->
  <g stroke="#ffffff" stroke-width="2" fill="none">
    <!-- Top Face -->
    <polygon points="100,48 142,68 100,88 58,68" fill="#1e3a5f" stroke="#38bdf8"/>
    <!-- Left Face -->
    <polygon points="58,68 100,88 100,136 58,116" fill="#0f294a" stroke="#38bdf8"/>
    <!-- Right Face -->
    <polygon points="142,68 100,88 100,136 142,116" fill="#162e4e" stroke="#38bdf8"/>
  </g>

  <!-- Interior Floorplan Grid / Compass Lines inside room -->
  <line x1="79" y1="78" x2="121" y2="78" stroke="url(#imAmber)" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="79" y1="126" x2="121" y2="126" stroke="url(#imAmber)" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- AI Spatial Nodes -->
  <circle cx="100" cy="48" r="4" fill="#f59e0b"/>
  <circle cx="142" cy="68" r="4" fill="#38bdf8"/>
  <circle cx="58" cy="68" r="4" fill="#38bdf8"/>
  <circle cx="100" cy="88" r="5" fill="#f59e0b"/>
  <circle cx="100" cy="136" r="4" fill="#f59e0b"/>

  <!-- Brand Typography -->
  <text x="100" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#ffffff" letter-spacing="1.5">INTERIORMITRA</text>
  <text x="100" y="174" text-anchor="middle" font-family="system-ui, sans-serif" font-size="6" font-weight="700" fill="#fbbf24" letter-spacing="0.8">3D SPATIAL AI APP</text>
</svg>
