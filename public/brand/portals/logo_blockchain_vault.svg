<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="vaultNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="vaultGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#e8b206"/>
    </linearGradient>
    <linearGradient id="vaultCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Heavy Vault Shield -->
  <path d="M 100 12 L 180 42 C 180 125 100 188 100 188 C 100 188 20 125 20 42 Z" fill="url(#vaultNavy)" stroke="url(#vaultGold)" stroke-width="3.5"/>
  <path d="M 100 24 L 168 50 C 168 118 100 174 100 174 C 100 174 32 118 32 50 Z" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Blockchain Node Rings -->
  <g stroke="url(#vaultCyan)" stroke-width="2" fill="none">
    <circle cx="100" cy="98" r="38" stroke-dasharray="6,4"/>
    <circle cx="100" cy="98" r="48" opacity="0.4"/>
  </g>

  <!-- Central Padlock / Question Paper Vault -->
  <rect x="78" y="88" width="44" height="36" rx="6" fill="#0f2444" stroke="url(#vaultGold)" stroke-width="2.5"/>
  <!-- Lock Shackle -->
  <path d="M 87 88 L 87 74 C 87 66 113 66 113 74 L 113 88" fill="none" stroke="url(#vaultGold)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Keyhole / Cryptographic Core -->
  <circle cx="100" cy="102" r="4" fill="#fbbf24"/>
  <polygon points="98,103 102,103 104,114 96,114" fill="#fbbf24"/>

  <!-- Blockchain Hash Blocks top and sides -->
  <rect x="91" y="32" width="18" height="12" rx="2" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="42" y="86" width="14" height="14" rx="2" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="144" y="86" width="14" height="14" rx="2" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="100" y1="44" x2="100" y2="62" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="56" y1="93" x2="78" y2="93" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="122" y1="93" x2="144" y2="93" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Bottom Authority Text -->
  <text x="100" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7.5" font-weight="800" fill="#f8fafc" letter-spacing="1.2">SECURED EXAM</text>
  <text x="100" y="159" text-anchor="middle" font-family="system-ui, sans-serif" font-size="6" font-weight="700" fill="#fbbf24" letter-spacing="0.8">BLOCKCHAIN VAULT</text>
</svg>
